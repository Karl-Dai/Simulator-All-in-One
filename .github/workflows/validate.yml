name: Validate source and packaging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packaging tests and syntax
        run: |
          python -m py_compile scripts/*.py packaging/linux/runtime.py
          python -m unittest discover -s scripts/tests -v
          sh -n packaging/linux/run-simlab.sh packaging/linux/self-extract.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Launcher UI checks
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
