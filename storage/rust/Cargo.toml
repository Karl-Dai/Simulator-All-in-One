[package]
name = "saio-shared"
version = "0.2.0"
edition = "2021"

[lib]
path = "lib.rs"

[features]
simlab-suite = []

[dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"
tempfile = "3"
tauri = { version = "2", features = [] }
