[package]
name = "pmusim-sub"
version = "0.13.2"
edition = "2021"

[lib]
name = "pmusim_sub"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
simlab-suite = ["saio-shared/simlab-suite"]

[dependencies]
saio-shared = { path = "../../../../storage/rust" }
tauri-plugin-dialog = "2"
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
sha2 = "0.10"
tempfile = "3"
pmusim-core = { path = "../pmusim-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
pmusim-app = { path = "../pmusim-app" }
hex = "0.4"
